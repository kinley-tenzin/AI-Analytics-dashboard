version: 2

sources:
  - name: raw
    description: >
      Raw ERP records loaded by the ingestion framework (Milestone 3). One row per distinct
      version of a source record, with full provenance. Never modified by dbt.
    schema: raw
    tables:
      - name: source_record
        description: Append-only record versions (payload = original API JSON).
        columns:
          - name: record_version_id
            data_tests: [unique, not_null]
          - name: source_system
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["odoo", "erpnext"]
          - name: source_instance
            data_tests: [not_null]
          - name: source_entity
            data_tests: [not_null]
          - name: source_id
            data_tests: [not_null]
          - name: payload
            data_tests: [not_null]
          - name: first_extracted_at
            data_tests: [not_null]
      - name: extraction_run
        description: Extraction log; successful runs define the dates on which snapshots exist.
        columns:
          - name: run_id
            data_tests: [unique, not_null]
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["running", "succeeded", "failed"]
