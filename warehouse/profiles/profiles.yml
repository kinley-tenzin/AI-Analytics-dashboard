# dbt connection profile. Contains NO secrets: every value comes from environment variables,
# which warehouse/run_dbt.py loads from the repository's .env file.
# The pipeline role owns the raw/staging/intermediate/marts schemas (see infrastructure/).
druksmart:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DRUKSMART_PG_HOST') }}"
      port: "{{ env_var('DRUKSMART_PG_PORT') | int }}"
      user: "{{ env_var('DRUKSMART_PIPELINE_USER') }}"
      password: "{{ env_var('DRUKSMART_PIPELINE_PASSWORD') }}"
      dbname: "{{ env_var('DRUKSMART_ANALYTICS_DB') }}"
      schema: staging
      threads: 4
      connect_timeout: 10
    # Isolated database for automated warehouse tests (synthetic fixtures only).
    test:
      type: postgres
      host: "{{ env_var('DRUKSMART_PG_HOST') }}"
      port: "{{ env_var('DRUKSMART_PG_PORT') | int }}"
      user: "{{ env_var('DRUKSMART_PIPELINE_USER') }}"
      password: "{{ env_var('DRUKSMART_PIPELINE_PASSWORD') }}"
      dbname: "{{ env_var('DRUKSMART_ANALYTICS_DB') }}_test"
      schema: staging
      threads: 4
      connect_timeout: 10
