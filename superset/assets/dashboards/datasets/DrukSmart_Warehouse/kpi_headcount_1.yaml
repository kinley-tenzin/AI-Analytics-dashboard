table_name: kpi_headcount
main_dttm_col: snapshot_date
currency_code_column: null
description: 'HR-01 / HR-02 active headcount per HR snapshot date. POINT-IN-TIME:
  headcount must not be summed across snapshot dates; dashboards select one snapshot
  date.'
default_endpoint: null
offset: 0
cache_timeout: null
