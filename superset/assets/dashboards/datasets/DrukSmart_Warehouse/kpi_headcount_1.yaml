metrics:
- metric_name: not_active_records
  verbose_name: Not-active employee records
  metric_type: null
  expression: SUM(employee_records) - SUM(active_headcount)
  description: Records that are not active on the snapshot date (left, inactive, suspended,
    not yet joined).
  d3format: ',d'
  currency: null
  extra:
    certification:
      certified_by: DrukSmart data engineering (dbt)
      details: KPI HR-01
  warning_text: Point-in-time metric. Filter to ONE snapshot date; do not sum across
    dates.
- metric_name: active_headcount
  verbose_name: Active headcount
  metric_type: null
  expression: SUM(active_headcount)
  description: Employees whose status on the snapshot date is 'active' (KPI_CATALOGUE
    HR-01).
  d3format: ',d'
  currency: null
  extra:
    certification:
      certified_by: DrukSmart data engineering (dbt)
      details: KPI HR-01 / HR-02
  warning_text: Point-in-time metric. Filter to ONE snapshot date; do not sum across
    dates.
- metric_name: employee_records
  verbose_name: Employee records (all statuses)
  metric_type: null
  expression: SUM(employee_records)
  description: Every employee record known on the snapshot date, whatever its status.
  d3format: ',d'
  currency: null
  extra:
    certification:
      certified_by: DrukSmart data engineering (dbt)
      details: KPI HR-01
  warning_text: Point-in-time metric. Filter to ONE snapshot date; do not sum across
    dates.
