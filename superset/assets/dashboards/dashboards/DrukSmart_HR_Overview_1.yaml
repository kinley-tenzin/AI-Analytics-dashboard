    meta:
      width: 8
      height: 38
      code: '### DrukSmart HR overview

        Headcount figures are **point-in-time**: they are shown for the *Snapshot
        date* selected in the

        filter bar (default: the latest extracted date). Leave statistics follow the
        *Leave period*

        filter and are counted in the month the leave **starts**. Source: published,
        tested warehouse

        datasets (`marts.kpi_headcount`, `marts.kpi_approved_leave_monthly`). Definitions:

        `docs/data/KPI_CATALOGUE.md` (HR-01..HR-03). If a chart says *No results*,
        the current filters

        (or your access rights) leave no data to show.'
