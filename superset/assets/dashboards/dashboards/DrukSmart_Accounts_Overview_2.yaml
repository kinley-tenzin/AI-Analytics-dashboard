    meta:
      width: 8
      height: 38
      code: '### DrukSmart Accounts overview

        Balances are **open amounts as of the selected *As-of date*** (default: the
        latest extracted

        date), in each organisation''s company currency; never add amounts of different
        currencies.

        Drafts and cancelled documents are excluded; credit notes reduce balances.
        Source:

        `marts.kpi_receivables_payables` (AC-01..AC-04 in `docs/data/KPI_CATALOGUE.md`).
        If a chart says

        *No results*, the current filters (or your access rights) leave no data to
        show.'
