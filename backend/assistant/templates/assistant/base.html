{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DrukSmart KPI Assistant{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'assistant/assistant.css' %}">
</head>
<body>
  <header class="topbar">
    <span class="brand">DrukSmart <span class="muted">KPI Assistant</span></span>
    {% if user.is_authenticated %}
      <nav>
        <span class="who">{{ user.get_username }}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link" type="submit">Log out</button></form>
      </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
